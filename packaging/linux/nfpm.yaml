# Build .deb and .rpm with nfpm (https://nfpm.goreleaser.com):
#   VERSION=0.1.0 ARCH=amd64 nfpm pkg -f packaging/linux/nfpm.yaml -p deb -t dist/
#   VERSION=0.1.0 ARCH=amd64 nfpm pkg -f packaging/linux/nfpm.yaml -p rpm -t dist/
name: votal-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Votal <support@votal.ai>
description: Votal endpoint agent - device posture, AI agent and MCP visibility, policy enforcement.
vendor: Votal
homepage: https://github.com/sundi133/nexus-agent
license: MIT
contents:
  - src: dist/votal-agent_linux_${ARCH}
    dst: /usr/bin/votal-agent
    file_info:
      mode: 0755
  - src: packaging/linux/votal-agent.service
    dst: /lib/systemd/system/votal-agent.service
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
