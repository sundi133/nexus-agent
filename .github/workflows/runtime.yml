name: runtime-ci

on:
  push:
    paths:
      - "runtime/**"
      - "core/**"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "core/**"
      - ".github/workflows/runtime.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test managed runtime
        run: cargo test --manifest-path runtime/Cargo.toml
      - name: Build managed runtime
        run: cargo build --release --manifest-path runtime/Cargo.toml
