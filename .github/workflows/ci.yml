name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Smoke test (collect + detect on a real OS)
        run: |
          go build -o votal-agent-smoke ./cmd/votal-agent
          ./votal-agent-smoke collect -osquery disabled
          ./votal-agent-smoke detect
        shell: bash

  lint-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
