[package]
name = "nexus-agent-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Managed control-plane runtime for Nexus endpoint agents"

[dependencies]
base64 = "0.22"
nexus-agent-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
